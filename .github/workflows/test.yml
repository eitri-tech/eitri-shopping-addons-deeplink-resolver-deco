name: Testes

on:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # registerHooks (stubs dos pacotes Eitri) precisa do Node >= 22.15.
          node-version: 22
      - run: node --test tests/*.test.mjs
